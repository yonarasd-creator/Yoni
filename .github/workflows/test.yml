name: Testler
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run test:static
      - run: npm run test:db
      - run: npm run test:update
      - run: npm test
      - run: npm run test:ui
